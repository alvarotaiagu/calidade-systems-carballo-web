# =============================================================================
#  Calidade Systems - convivencia de la web nueva con el WordPress existente
#  Generado el 2026-09-17
#
#  Regla de oro: el WordPress NO se toca. Sigue instalado y sigue sirviendo,
#  sin cambios y con 200, las 40 URLs de articulo (/es/AAAA/MM/DD/slug/ y
#  /en/AAAA/MM/DD/slug/), sus feeds y su post-sitemap.xml. La web nueva solo
#  ocupa la raiz, /es/, /en/ y las paginas estaticas nuevas.
#
#  Rutas que hay que ajustar:
#    /var/www/calidade-nueva   -> carpeta de esta web estatica
#    127.0.0.1:8080            -> como se llega hoy al PHP-FPM / Apache de WP
# =============================================================================

# --- 1 · mapa de redirecciones 301 (fuera del server, a nivel http) ---------
map $uri $calidade_301 {
    default "";
    include /etc/nginx/calidade/redirecciones-301.map;
}

server {
    listen 443 ssl http2;
    server_name www.calidade.systems calidade.systems;

    root /var/www/calidade-nueva;
    index index.html;

    # ssl_certificate / ssl_certificate_key: los que ya esten en uso

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml;

    # --- 2 · las URLs antiguas migradas ------------------------------------
    # Se comprueba antes que nada. $uri va sin query string, asi que
    # /es/services/peritaje-informatico/?utm_source=x tambien entra.
    if ($calidade_301 != "") {
        return 301 $calidade_301;
    }

    # --- 3 · la raiz sirve espanol -----------------------------------------
    # Hoy / devuelve un 302 a /en/. Pasa a 301 a /es/, que es el x-default.
    location = / {
        return 301 /es/;
    }

    # --- 4 · portadas nuevas ------------------------------------------------
    # Coincidencia exacta (=): gana a cualquier location por prefijo o regex,
    # asi que /es/ es la portada nueva mientras /es/2019/01/10/... sigue
    # yendo a WordPress sin que haya que enumerar nada.
    location = /es/ { try_files /es/index.html =404; }
    location = /en/ { try_files /en/index.html =404; }

    # --- 5 · paginas estaticas nuevas --------------------------------------
    # Solo las que terminan en .html dentro de /es/ o /en/. Las URLs de
    # articulo nunca terminan en .html, asi que no hay solape posible.
    location ~ ^/(es|en)/[a-z0-9-]+\.html$ {
        try_files $uri =404;
    }

    # --- 6 · assets de la web nueva ----------------------------------------
    # Ninguno de estos prefijos existe en WordPress (los suyos cuelgan de
    # /wp-content/ y /wp-includes/), asi que no se pisan.
    location ^~ /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /css/ { expires 7d; try_files $uri =404; }
    location ^~ /js/  { expires 7d; try_files $uri =404; }

    location = /manifest.json       { try_files $uri =404; }
    location = /robots.txt          { try_files $uri =404; }
    location = /sitemap.xml         { try_files $uri =404; }   # indice NUEVO
    location = /sitemap-paginas.xml { try_files $uri =404; }
    location = /404.html            { try_files $uri =404; }

    # --- 7 · todo lo demas: WordPress, intacto -----------------------------
    # Aqui caen los 40 articulos, /wp-json/ (que es lo que consume la
    # portada nueva para pintar las ultimas entradas), /wp-admin/, /feed/,
    # /wp-content/uploads/, post-sitemap.xml, category-sitemap.xml...
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;
}

# --- 8 · dominio sin www ------------------------------------------------------
# El canonical de todo el sitio es con www. Si calidade.systems (sin www)
# resuelve, que haga 301 al mismo path con www en lugar de duplicar.
server {
    listen 443 ssl http2;
    server_name calidade.systems;
    return 301 https://www.calidade.systems$request_uri;
}
